name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run automated tests
        id: run-tests
        run: python -m pytest

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Set up Java for Allure
        if: always() && steps.run-tests.outcome != 'skipped'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Allure
        if: always() && steps.run-tests.outcome != 'skipped'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Allure Commandline
        if: always() && steps.run-tests.outcome != 'skipped'
        run: npm install --global allure-commandline@2.46.1

      - name: Generate Allure HTML report
        if: always() && steps.run-tests.outcome != 'skipped'
        run: allure generate reports/allure-results --clean --output reports/allure-report

      - name: Upload Allure HTML report
        if: always() && steps.run-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-report:
    name: Publish Allure report
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.notice('GitHub Pages is not enabled. The Allure report is available as a workflow artifact; enable Pages with GitHub Actions as its source to publish it.');
              core.setOutput('enabled', 'false');
            }

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Download Allure HTML report
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report

      - name: Upload report for GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
