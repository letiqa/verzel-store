[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --alluredir=reports/allure-results --clean-alluredir
base_url = https://verzel-store.qa-test-verzel-store.workers.dev

markers =
    ui: Testes de interface de usuário (Web)
    api: Testes de API HTTP
    e2e: Testes end-to-end de fluxo completo de compra
    smoke: Testes rápidos de sanidade do sistema
    regressao: Suite completa de regressão
    ca01: CA01 - Cupom BEMVINDO10 com 10%% de desconto
    ca02: CA02 - Cupom case-insensitive e limpeza de espaços
    ca03: CA03 - Mensagem de cupom inexistente
    ca04: CA04 - Mensagem de cupom expirado
    ca05: CA05 - Apenas um cupom por vez e remoção
    ca06: CA06 - Frete grátis a partir de R$ 200,00 inclusive
    ca07: CA07 - Frete fixo R$ 19,90 e valor faltante abaixo de R$ 200,00
    ca08: CA08 - Frete grátis considerando subtotal pré-desconto
    ca09: CA09 - Desconto do cupom não incide sobre frete
    ca10: CA10 - Limite de 5 unidades por produto
    ca11: CA11 - Arredondamento de valores em 2 casas decimais
    checkout: Validações de checkout e finalização de pedido
    bug: Cenários que expõem defeitos encontrados no ambiente
